<!DOCTYPE html>
<html>

<head>

<title>Security Outing History</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

.header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
}

.container{
width:95%;
margin:30px auto;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 5px 10px rgba(0,0,0,.15);
}

th{
background:#3498db;
color:white;
padding:12px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f1f1f1;
}

.back{
margin-top:20px;
text-align:center;
}

button{
padding:10px 20px;
background:#2c3e50;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<h2>📋 Security Outing History</h2>

</div>

<div class="container">

<table>

<tr>

<th>Permission ID</th>
<th>Register No</th>
<th>Name</th>
<th>Type</th>
<th>Destination</th>
<th>Out Date</th>
<th>Return Date</th>
<th>Status</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
<td>{{ row[6] }}</td>
<td>{{ row[7] }}</td>

</tr>

{% endfor %}

</table>

<div class="back">

<a href="/security/dashboard">

<button>⬅ Back</button>

</a>

</div>

</div>

</body>

</html>
