<!DOCTYPE html>
<html>

<head>

<title>Edit Student</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:700px;
    margin:35px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

h2{
    color:#2c3e50;
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    color:#2c3e50;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
    box-sizing:border-box;
}

input[readonly]{
    background:#eeeeee;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.save{
    flex:1;
    background:#27ae60;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.save:hover{
    background:#219150;
}

.back{
    flex:1;
    background:#34495e;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.back:hover{
    background:#22313f;
}

a{
    text-decoration:none;
    flex:1;
}

</style>

</head>

<body>

<div class="header">

<h1>✏ Edit Student</h1>

</div>

<div class="container">

<div class="card">

<h2>Student Details</h2>

<form method="POST">

<label>Register Number</label>

<input
type="text"
value="{{ student[0] }}"
readonly>

<label>Student Name</label>

<input
type="text"
name="student_name"
value="{{ student[1] }}"
required>

<label>Department</label>

<input
type="text"
name="department"
value="{{ student[2] }}"
required>

<label>Year</label>

<select name="year" required>

<option value="1" {% if student[3]=="1" %}selected{% endif %}>1st Year</option>

<option value="2" {% if student[3]=="2" %}selected{% endif %}>2nd Year</option>

<option value="3" {% if student[3]=="3" %}selected{% endif %}>3rd Year</option>

<option value="4" {% if student[3]=="4" %}selected{% endif %}>4th Year</option>

<option value="5" {% if student[3]=="5" %}selected{% endif %}>Completed</option>

</select>

<label>Gender</label>

<select name="gender" required>

<option value="Male"
{% if student[4]=="Male" %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if student[4]=="Female" %}selected{% endif %}>
Female
</option>

</select>

<label>Mobile Number</label>

<input
type="text"
name="mobile"
value="{{ student[5] }}"
required>

<div class="buttons">

<button
type="submit"
class="save">

💾 Update Student

</button>

<a href="/admin/students">

<button
type="button"
class="back">

⬅ Back

</button>

</a>

</div>

</form>

</div>

</div>

</body>

</html>
