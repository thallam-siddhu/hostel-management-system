<!DOCTYPE html>
<html>

<head>

<title>Request Room Change</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:650px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

label{
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    height:120px;
    resize:none;
}

.submit{
    background:#27ae60;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.submit:hover{
    background:#219150;
}

.back{
    background:#3498db;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.back:hover{
    background:#2980b9;
}

</style>

</head>

<body>

<div class="header">

<h1>🛏 Request Room Change</h1>

</div>

<div class="container">

<div class="card">

<form method="POST">

<label>Select New Room</label>

<select name="requested_room_id" required>

<option value="">Select Room</option>

{% for room in rooms %}

<option value="{{ room[0] }}">

Room {{ room[1] }}

</option>

{% endfor %}

</select>

<label>Reason</label>

<textarea
name="reason"
placeholder="Enter reason for room change..."
required></textarea>

<button class="submit" type="submit">

📩 Submit Request

</button>

</form>

<br>

<a href="/student/dashboard">

<button class="back">

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</body>

</html>
