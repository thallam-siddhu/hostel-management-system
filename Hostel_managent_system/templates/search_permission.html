<!DOCTYPE html>
<html>

<head>

    <title>Verify Permission</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
        }

        .container{

            width:500px;
            margin:auto;
            margin-top:80px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
            text-align:center;

        }

        input{

            width:90%;
            padding:12px;
            font-size:16px;
            margin-top:15px;

        }

        button{

            margin-top:20px;
            padding:12px 25px;
            font-size:16px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:5px;

        }

        a{

            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="container">

<h2>🔍 Verify Student Permission</h2>

<form method="POST">

<input
type="text"
name="permission_id"
placeholder="Enter Permission ID (Example: PASS123456)"
required>

<br>

<button type="submit">
Verify Permission
</button>

</form>

<br>

<a href="/security/dashboard">

<button style="background:#3498db;">
Back
</button>

</a>

</div>

</body>

</html>
