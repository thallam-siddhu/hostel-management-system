<!DOCTYPE html>
<html>

<head>

<title>Student Report</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1400px;
    margin:30px auto;
}

.card{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    padding:20px;
}

h2{
    margin-top:0;
    color:#2c3e50;
}

.search{
    margin-bottom:20px;
}

.search input{

    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;

}

table{

    width:100%;
    border-collapse:collapse;

}

th{

    background:#3498db;
    color:white;
    padding:12px;

}

td{

    border:1px solid #ddd;
    padding:12px;
    text-align:center;

}

tr:nth-child(even){

    background:#f9f9f9;

}

tr:hover{

    background:#eef6ff;

}

.buttons{

    text-align:center;
    margin-top:25px;

}

button{

    background:#2c3e50;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
    font-size:15px;

}

button:hover{

    background:#1d2c3b;

}

.print{

    background:#27ae60;

}

.print:hover{

    background:#1e8449;

}

</style>

<script>

function searchStudent(){

    let input=document.getElementById("search").value.toLowerCase();

    let rows=document.getElementById("studentTable").rows;

    for(let i=1;i<rows.length;i++){

        let text=rows[i].innerText.toLowerCase();

        rows[i].style.display=text.includes(input)?"":"none";

    }

}

function printReport(){

    window.print();

}

</script>

</head>

<body>

<div class="header">

<h1>👨‍🎓 Student Report</h1>

<p>Hostel Management System</p>

</div>

<div class="container">

<div class="card">

<h2>Student Details</h2>

<div class="search">

<input
type="text"
id="search"
placeholder="🔍 Search by Register No, Name, Department..."
onkeyup="searchStudent()">

</div>

<table id="studentTable">

<tr>

<th>Register No</th>
<th>Name</th>
<th>Department</th>
<th>Year</th>
<th>Gender</th>
<th>Block</th>
<th>Floor</th>
<th>Room</th>

</tr>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>{{ student[4] }}</td>
<td>{{ student[6] }}</td>
<td>{{ student[7] }}</td>
<td>{{ student[5] }}</td>

</tr>

{% endfor %}

</table>

<div class="buttons">

<button class="print" onclick="printReport()">

🖨 Print Report

</button>

<a href="/admin/reports">

<button>

⬅ Back to Reports

</button>

</a>

</div>

</div>

</div>

</body>

</html>
