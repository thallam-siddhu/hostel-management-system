<!DOCTYPE html>
<html>

<head>

<title>Edit Security Staff</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.card{
    width:550px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

.info{
    background:#ecf0f1;
    border-left:5px solid #3498db;
    padding:12px;
    margin-bottom:25px;
    border-radius:6px;
    color:#2c3e50;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#3498db;
}

.update-btn{
    width:100%;
    padding:13px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.update-btn:hover{
    background:#2980b9;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
}

.back button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

.back button:hover{
    background:#1f2d3d;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="card">

<h2>👮 Edit Security Staff</h2>

<div class="info">

Update the security staff details below. Leave the password blank if you don't want to change it.

</div>

<form method="POST">

<label>Security Name</label>

<input
type="text"
name="security_name"
value="{{ security[1] }}"
placeholder="Enter Security Staff Name"
required>

<label>Username</label>

<input
type="text"
name="username"
value="{{ security[2] }}"
placeholder="Enter Username"
required>

<label>Mobile Number</label>

<input
type="tel"
name="mobile"
value="{{ security[3] }}"
placeholder="Enter Mobile Number"
maxlength="10"
pattern="[0-9]{10}"
required>

<label>New Password (Optional)</label>

<input
type="password"
name="password"
placeholder="Leave blank to keep existing password">

<button
type="submit"
class="update-btn">

💾 Update Security Staff

</button>

</form>

<div class="back">

<a href="/admin/security">

<button type="button">

⬅ Back to Security Management

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | Security Management

</div>

</body>

</html>
