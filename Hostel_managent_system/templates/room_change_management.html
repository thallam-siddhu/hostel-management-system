<!DOCTYPE html>
<html>

<head>

<title>Room Change Management</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:linear-gradient(135deg,#2c3e50,#34495e);
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.card{
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:30px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.menu a{
    text-decoration:none;
}

.box{

    background:linear-gradient(135deg,#3498db,#2980b9);

    color:white;

    text-align:center;

    border-radius:12px;

    padding:35px;

    font-size:20px;

    font-weight:bold;

    transition:.3s;

}

.box:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 18px rgba(0,0,0,.25);

}

.back{

    text-align:center;

    margin-top:30px;

}

.back button{

    background:#2c3e50;

    color:white;

    border:none;

    padding:12px 25px;

    border-radius:6px;

    cursor:pointer;

    font-size:16px;

}

.back button:hover{

    background:#1d2c3b;

}

</style>

</head>

<body>

<div class="header">

<h1>🏠 Room Change Management</h1>

</div>

<div class="container">

<div class="card">

<h2>Select an Option</h2>

<div class="menu">

<a href="/admin/room_change_requests">

<div class="box">

📋<br><br>

Student Room Change Requests

</div>

</a>

<a href="/admin/direct_change_room">

<div class="box">

🔄<br><br>

Direct Room Change

</div>

</a>

</div>

<div class="back">

<a href="/admin/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</div>

</body>

</html>
