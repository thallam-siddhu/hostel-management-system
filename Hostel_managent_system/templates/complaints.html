<!DOCTYPE html>
<html>

<head>

<title>Complaint Management</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 2px 10px rgba(0,0,0,.2);
    margin-bottom:30px;
}

h2{
    margin-top:0;
}

label{
    font-weight:bold;
}

input,
select,
textarea{

    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;

}

textarea{
    resize:none;
}

.submit{

    background:#27ae60;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;

}

.submit:hover{

    background:#219150;

}

table{

    width:100%;
    border-collapse:collapse;

}

table th{

    background:#2c3e50;
    color:white;
    padding:12px;

}

table td{

    border:1px solid #ddd;
    padding:10px;
    text-align:center;

}

tr:nth-child(even){

    background:#f8f8f8;

}

.pending{

    background:orange;
    color:white;
    padding:5px 12px;
    border-radius:15px;

}

.resolved{

    background:green;
    color:white;
    padding:5px 12px;
    border-radius:15px;

}

.back{

    text-align:center;
    margin-top:20px;

}

.back button{

    background:#34495e;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;

}

.back button:hover{

    background:#2c3e50;

}

</style>

</head>

<body>

<div
