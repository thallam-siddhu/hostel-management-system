<!DOCTYPE html>
<html>

<head>

<title>College Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:60px;
}

.card{
    width:400px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

label{
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus{
    border-color:#3498db;
    outline:none;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background:#2980b9;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register p{
    margin-bottom:10px;
    color:#555;
}

.register button{
    padding:10px 20px;
    background:#2ecc71;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

.register button:hover{
    background:#27ae60;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="card">

<h2>College Login</h2>

<form method="POST">

<label>College Code</label>

<input
type="text"
name="college_code"
placeholder="Enter College Code"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button
type="submit"
class="login-btn">

🔐 Login

</button>

</form>

<div class="register">

<p>Don't have a college account?</p>

<a href="/admin/register">

<button type="button">

➕ Create College Account

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | College Admin Portal

</div>

</body>

</html>
