<!DOCTYPE html>
<html>

<head>

<title>Mess Menu Management</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1300px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    margin-bottom:30px;
}

h2{
    color:#2c3e50;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    resize:vertical;
    min-height:60px;
}

button{
    margin-top:20px;
    background:#27ae60;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:5px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#219150;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#3498db;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f8f8;
}

.action a{
    text-decoration:none;
    padding:6px 12px;
    border-radius:4px;
    color:white;
    font-size:14px;
}

.edit{
    background:#f39c12;
}

.delete{
    background:#e74c3c;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back button{
    background:#2c3e50;
}

.back button:hover{
    background:#1d2c3b;
}

</style>

</head>

<body>

<div class="header">

<h1>🍽 Weekly Mess Menu</h1>

</div>

<div class="container">

<div class="card">

<h2>Add / Update Menu</h2>

<form method="POST">

<label>Day</label>

<select name="day" required>

<option>Monday</option>
<option>Tuesday</option>
<option>Wednesday</option>
<option>Thursday</option>
<option>Friday</option>
<option>Saturday</option>
<option>Sunday</option>

</select>

<label>Breakfast</label>

<textarea name="breakfast" required></textarea>

<label>Lunch</label>

<textarea name="lunch" required></textarea>

<label>Snacks</label>

<textarea name="snacks" required></textarea>

<label>Dinner</label>

<textarea name="dinner" required></textarea>

<button type="submit">

💾 Save Menu

</button>

</form>

</div>

<div class="card">

<h2>Weekly Menu</h2>

{% if menus %}

<table>

<tr>

<th>Day</th>
<th>Breakfast</th>
<th>Lunch</th>
<th>Snacks</th>
<th>Dinner</th>
<th>Action</th>

</tr>

{% for menu in menus %}

<tr>

<td>{{ menu[1] }}</td>
<td>{{ menu[2] }}</td>
<td>{{ menu[3] }}</td>
<td>{{ menu[4] }}</td>
<td>{{ menu[5] }}</td>

<td class="action">

<a class="edit" href="/admin/edit_menu/{{ menu[0] }}">

✏ Edit

</a>

&nbsp;

<a class="delete"
href="/admin/delete_menu/{{ menu[0] }}"
onclick="return confirm('Delete this menu?')">

🗑 Delete

</a>

</td>

</tr>

{% endfor %}

</table>

{% else %}

<h3 align="center">No menu added yet.</h3>

{% endif %}

</div>

<div class="back">

<a href="/admin/dashboard">

<button type="button">

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</body>

</html>
