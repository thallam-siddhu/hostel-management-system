<!DOCTYPE html>
<html>

<head>

<title>Direct Room Change</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:700px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

select{
    width:100%;
    padding:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#3498db;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

.success{
    background:#d4edda;
    color:#155724;
    border:1px solid #c3e6cb;
    padding:12px;
    border-radius:5px;
    margin-bottom:20px;
}

.error{
    background:#f8d7da;
    color:#721c24;
    border:1px solid #f5c6cb;
    padding:12px;
    border-radius:5px;
    margin-bottom:20px;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back button{
    width:auto;
    background:#2c3e50;
    padding:10px 25px;
}

.back button:hover{
    background:#1d2c3b;
}

.back a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="header">

<h1>🔄 Direct Room Change</h1>

</div>

<div class="container">

<div class="card">

{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}

            {% if "successfully" in message %}

            <div class="success">
                {{ message }}
            </div>

            {% else %}

            <div class="error">
                {{ message }}
            </div>

            {% endif %}

        {% endfor %}
    {% endif %}
{% endwith %}

<form action="/admin/direct_change_room" method="POST">

<label>Select Student</label>

<select name="student_id" required>

{% for student in students %}

<option value="{{ student[0] }}">
{{ student[1] }} ({{ student[2] }})
</option>

{% endfor %}

</select>

<label>Select New Room</label>

<select name="room_id" required>

{% for room in rooms %}

<option value="{{ room[0] }}">
Block {{ room[3] }} | Floor {{ room[2] }} | Room {{ room[1] }}
</option>

{% endfor %}

</select>

<button type="submit">
🔄 Change Room
</button>

</form>

<div class="back">

<a href="/admin/dashboard">

<button type="button">
⬅ Back to Dashboard
</button>

</a>

</div>

</div>

</div>

</body>

</html>
