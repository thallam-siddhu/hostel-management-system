<!DOCTYPE html>
<html>

<head>

<title>Security Change Password</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:500px;
    margin:40px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2980b9;
}

.success{
    background:#d4edda;
    color:#155724;
    padding:12px;
    border-radius:5px;
    margin-bottom:20px;
}

.error{
    background:#f8d7da;
    color:#721c24;
    padding:12px;
    border-radius:5px;
    margin-bottom:20px;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back button{
    width:auto;
    background:#2c3e50;
    padding:10px 25px;
}

.back button:hover{
    background:#1f2d3d;
}

</style>

</head>

<body>

<div class="header">

<h1>🔑 Security Change Password</h1>

</div>

<div class="container">

<div class="card">

{% if success %}
<div class="success">
{{ success }}
</div>
{% endif %}

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST">

<label>Current Password</label>

<input
type="password"
name="current_password"
required>

<label>New Password</label>

<input
type="password"
name="new_password"
required>

<label>Confirm New Password</label>

<input
type="password"
name="confirm_password"
required>

<button type="submit">

🔑 Change Password

</button>

</form>

<div class="back">

<a href="/security/dashboard">

<button type="button">

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</div>

</body>

</html>
