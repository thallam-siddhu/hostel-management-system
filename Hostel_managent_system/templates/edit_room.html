<!DOCTYPE html>
<html>

<head>

<title>Edit Room</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:60px;
}

.card{
    width:500px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

.info-box{
    background:#ecf0f1;
    padding:12px;
    border-left:5px solid #3498db;
    border-radius:6px;
    margin-bottom:20px;
    color:#2c3e50;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#3498db;
}

.update-btn{
    width:100%;
    padding:12px;
    background:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.update-btn:hover{
    background:#2980b9;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
}

.back button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

.back button:hover{
    background:#1f2d3d;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="card">

<h2>🚪 Edit Room</h2>

<div class="info-box">

Update the room details below.

</div>

<form method="POST">

<label>Room Number</label>

<input
type="text"
name="room_no"
value="{{ room[1] }}"
placeholder="Enter Room Number"
required>

<label>Room Capacity</label>

<input
type="number"
name="capacity"
value="{{ room[2] }}"
min="1"
placeholder="Enter Room Capacity"
required>

<button
type="submit"
class="update-btn">

💾 Update Room

</button>

</form>

<div class="back">

<a href="/admin/rooms">

<button type="button">

⬅ Back to Room Management

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | Room Management

</div>

</body>

</html>
