<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Room</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:#eef2f7;

}

.header{

    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.header h1{

    font-size:32px;

}

.container{

    width:95%;
    max-width:650px;
    margin:40px auto;

}

.card{

    background:white;
    border-radius:18px;
    padding:35px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);

}

.card h2{

    color:#2c3e50;
    margin-bottom:25px;
    border-left:6px solid #3498db;
    padding-left:12px;

}

label{

    font-weight:bold;
    color:#2c3e50;

}

input,
select{

    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:22px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
    transition:.3s;

}

input:focus,
select:focus{

    border-color:#3498db;
    box-shadow:0 0 8px rgba(52,152,219,.3);

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#3498db,#2980b9);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;

}

button:hover{

    transform:translateY(-3px);

}

.back{

    text-align:center;
    margin-top:20px;

}

.back a{

    text-decoration:none;

}

.back button{

    width:220px;
    background:#34495e;

}

.footer{

    text-align:center;
    padding:20px;
    color:#777;

}

@media(max-width:600px){

.header h1{

font-size:24px;

}

.card{

padding:25px;

}

}

</style>

</head>

<body>

<div class="header">

<h1>🏫 Hostel Management System</h1>

<p>Admin Panel</p>

</div>

<div class="container">

<div class="card">

<h2>🚪 Add New Room</h2>

<form method="POST">

<label>Select Block</label>

<select name="block_id" id="block_id" required>

<option value="">Choose Block</option>

{% for block in blocks %}

<option value="{{ block[0] }}">
{{ block[1] }}
</option>

{% endfor %}

</select>

<label>Select Floor</label>

<select name="floor_id" id="floor_id" required>

<option value="">Select Floor</option>

</select>

<label>Room Number</label>

<input
type="text"
name="room_no"
placeholder="Example : 101"
required>

<label>Room Capacity</label>

<input
type="number"
name="capacity"
placeholder="Enter Capacity"
min="1"
required>

<button type="submit">

➕ Add Room

</button>

</form>

<div class="back">

<a href="/admin/rooms">

<button type="button">

⬅ Back to Room Management

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System

</div>

<script>

document.getElementById("block_id").addEventListener("change",function(){

let block_id=this.value;

let floor=document.getElementById("floor_id");

if(block_id==""){

floor.innerHTML="<option value=''>Select Floor</option>";

return;

}

floor.innerHTML="<option>Loading...</option>";

fetch("/get_floors/"+block_id)

.then(response=>response.json())

.then(data=>{

floor.innerHTML="<option value=''>Select Floor</option>";

data.forEach(function(item){

floor.innerHTML+=`
<option value="${item[0]}">
${item[1]}
</option>`;

});

})

.catch(error=>{

floor.innerHTML="<option>No Floors Found</option>";

console.log(error);

});

});

</script>

</body>
</html>
