<!DOCTYPE html>
<html>

<head>

<title>Security Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:1200px;
    margin:40px auto;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.top-bar h2{
    color:#2c3e50;
}

.add-btn{
    background:#27ae60;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:6px;
    font-weight:bold;
    transition:.3s;
}

.add-btn:hover{
    background:#229954;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

th{
    background:#34495e;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f9fa;
}

.edit-btn{
    background:#3498db;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
    margin-right:5px;
    transition:.3s;
}

.edit-btn:hover{
    background:#2980b9;
}

.delete-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
    transition:.3s;
}

.delete-btn:hover{
    background:#c0392b;
}

.back{
    text-align:center;
    margin-top:30px;
}

.back button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

.back button:hover{
    background:#1f2d3d;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="top-bar">

<h2>👮 Security Staff Management</h2>

<a href="/admin/add_security" class="add-btn">

➕ Add Security Staff

</a>

</div>

<table>

<tr>

<th>👤 Security Name</th>
<th>🆔 Username</th>
<th>📱 Mobile Number</th>
<th>⚙ Actions</th>

</tr>

{% for s in security %}

<tr>

<td>{{ s[1] }}</td>

<td>{{ s[2] }}</td>

<td>{{ s[3] }}</td>

<td>

<a href="/admin/edit_security/{{ s[0] }}">

<button class="edit-btn">

✏ Edit

</button>

</a>

<a href="/admin/delete_security/{{ s[0] }}"
onclick="return confirm('Are you sure you want to delete this security staff?')">

<button class="delete-btn">

🗑 Delete

</button>

</a>

</td>

</tr>

{% endfor %}

</table>

<div class="back">

<a href="/admin/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | Security Management

</div>

</body>

</html>
