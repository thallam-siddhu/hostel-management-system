<!DOCTYPE html>
<html>

<head>

<title>My Roommates</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2c3e50;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f8f8;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:6px;
    cursor:pointer;
}

.back button:hover{
    background:#1f2d3d;
}

</style>

</head>

<body>

<div class="header">

<h1>👥 My Roommates</h1>

</div>

<div class="container">

<div class="card">

{% if roommates %}

<table>

<tr>

<th>S.No</th>
<th>Register No</th>
<th>Name</th>
<th>Department</th>
<th>Year</th>
<th>Mobile</th>

</tr>

{% for student in roommates %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ student[0] }}</td>

<td>{{ student[1] }}</td>

<td>{{ student[2] }}</td>

<td>{{ student[3] }}</td>

<td>{{ student[4] }}</td>

</tr>

{% endfor %}

</table>

{% else %}

<h3 align="center">
No roommates found.
</h3>

{% endif %}

<div class="back">

<a href="/student/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</div>

</body>

</html>
