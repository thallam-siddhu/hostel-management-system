<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Management System</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Dark sleek base */
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glow Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            z-index: 1;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #059669);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.05); }
        }

        /* Glassmorphism Card Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Logo Badge Styling */
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 36px;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        a {
            text-decoration: none;
            display: block;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid transparent;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 0.2px;
        }

        /* Admin Button Styling */
        .btn-admin {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .btn-admin:hover {
            background: #3b82f6;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        /* Student Button Styling */
        .btn-student {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .btn-student:hover {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }

        /* Security Button Styling */
        .btn-security {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .btn-security:hover {
            background: #f59e0b;
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        .btn i {
            font-size: 18px;
        }

        /* Footer */
        .footer {
            margin-top: 36px;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }

        .version {
            margin-top: 6px;
            color: #475569;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <!-- Ambient Glow background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <!-- Logo -->
        <div class="logo-wrapper">
            <i class="fa-solid fa-building-user"></i>
        </div>

        <h1>Hostel Management</h1>
        <div class="subtitle">Smart • Secure • Digital Administration</div>

        <!-- Login Buttons -->
        <div class="btn-group">
            <a href="{{ url_for('admin_login') }}">
                <button class="btn btn-admin">
                    <i class="fa-solid fa-user-gear"></i> Admin Login
                </button>
            </a>

            <a href="{{ url_for('student_login') }}">
                <button class="btn btn-student">
                    <i class="fa-solid fa-user-graduate"></i> Student Login
                </button>
            </a>

            <a href="{{ url_for('security_login') }}">
                <button class="btn btn-security">
                    <i class="fa-solid fa-shield-halved"></i> Security Login
                </button>
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            © 2026 Hostel Management System
            <div class="version">
                Version 1.0 • Powered by Flask & SQLite
            </div>
        </div>
    </div>

</body>
</html>
