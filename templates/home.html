<!DOCTYPE html>
<html>

<head>

<title>Hostel Management System</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(135deg,#1e3c72,#2a5298,#4facfe);

    overflow:hidden;

}

/* Background Animation */

body::before{

    content:"";

    position:absolute;

    width:600px;

    height:600px;

    background:rgba(255,255,255,.08);

    border-radius:50%;

    top:-180px;

    left:-180px;

}

body::after{

    content:"";

    position:absolute;

    width:500px;

    height:500px;

    background:rgba(255,255,255,.05);

    border-radius:50%;

    bottom:-180px;

    right:-180px;

}

.container{

    position:relative;

    z-index:10;

    width:430px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    border-radius:20px;

    padding:40px;

    text-align:center;

    box-shadow:0 15px 35px rgba(0,0,0,.35);

    border:1px solid rgba(255,255,255,.25);

}

.logo{

    font-size:70px;

    margin-bottom:10px;

}

h1{

    color:white;

    font-size:30px;

    margin-bottom:8px;

}

.subtitle{

    color:#ecf0f1;

    margin-bottom:30px;

    font-size:15px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:10px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    margin-bottom:18px;

    transition:.35s;

}

.admin{

    background:#3498db;

    color:white;

}

.student{

    background:#27ae60;

    color:white;

}

.security{

    background:#e67e22;

    color:white;

}

button:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(0,0,0,.25);

}

a{

    text-decoration:none;

}

.footer{

    margin-top:20px;

    color:white;

    font-size:13px;

    opacity:.9;

}

.version{

    margin-top:8px;

    color:#dfe6e9;

    font-size:12px;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

🏫

</div>

<h1>

Hostel Management System

</h1>

<div class="subtitle">

Smart • Secure • Digital Hostel Administration

</div>

<a href="{{ url_for('admin_login') }}">

<button class="admin">

👨‍💼 Admin Login

</button>

</a>

<a href="{{ url_for('student_login') }}">

<button class="student">

🎓 Student Login

</button>

</a>

<a href="{{ url_for('security_login') }}">

<button class="security">

🛡 Security Login

</button>

</a>

<div class="footer">

© 2026 Hostel Management System

<div class="version">

Version 1.0 | Developed Using Flask & SQLite

</div>

</div>

</div>

</body>

</html>
