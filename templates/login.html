<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:450px;

height:450px;

background:rgba(255,255,255,.08);

border-radius:50%;

top:-120px;

left:-120px;

}

body::after{

content:"";

position:absolute;

width:350px;

height:350px;

background:rgba(255,255,255,.06);

border-radius:50%;

bottom:-100px;

right:-100px;

}

.login-box{

position:relative;

width:420px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(18px);

padding:40px;

border-radius:20px;

box-shadow:0 20px 40px rgba(0,0,0,.4);

text-align:center;

border:1px solid rgba(255,255,255,.2);

z-index:1;

}

.logo{

font-size:65px;

margin-bottom:10px;

}

h1{

color:white;

font-size:30px;

margin-bottom:8px;

}

h2{

color:#f1f1f1;

margin-bottom:30px;

font-size:22px;

}

input{

width:100%;

padding:14px;

margin-bottom:18px;

border:none;

border-radius:8px;

font-size:15px;

outline:none;

background:rgba(255,255,255,.9);

}

button{

width:100%;

padding:14px;

border:none;

border-radius:8px;

background:#3498db;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#2980b9;

transform:translateY(-2px);

}

a{

color:#ffffff;

text-decoration:none;

font-weight:bold;

}

a:hover{

text-decoration:underline;

}

.footer{

margin-top:25px;

color:#ecf0f1;

font-size:13px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

🏫

</div>

<h1>

Hostel Management System

</h1>

<h2>

👨‍💼 Admin Login

</h2>

<form action="/admin/login" method="POST">

<input
type="text"
name="college_code"
placeholder="Enter College Code"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">

🔐 Login

</button>

</form>

<br>

<p style="color:white;">

Don't have a College Account?

</p>

<br>

<a href="/admin/register">

Create College Account

</a>

<div class="footer">

© 2026 Hostel Management System

</div>

</div>

</body>

</html>
