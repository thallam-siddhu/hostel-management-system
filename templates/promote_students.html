<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Promote Students</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f7fb;
}

.header{

    background:linear-gradient(135deg,#2c3e50,#34495e);
    color:white;
    text-align:center;
    padding:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.header h1{

    font-size:34px;

}

.container{

    width:95%;
    max-width:650px;
    margin:40px auto;

}

.card{

    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.card h2{

    color:#2c3e50;
    border-left:6px solid #3498db;
    padding-left:12px;
    margin-bottom:30px;

}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#2c3e50;

}

select{

    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:10px;
    margin-bottom:25px;
    font-size:16px;

}

.info{

    background:#fff8dc;
    border-left:6px solid orange;
    padding:18px;
    border-radius:10px;
    margin-bottom:25px;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    color:white;
    margin-top:10px;

}

.promote{

    background:#27ae60;

}

.promote:hover{

    background:#229954;

}

.back{

    background:#34495e;

}

.back:hover{

    background:#2c3e50;

}

.footer{

    text-align:center;
    color:#777;
    margin-top:30px;

}

</style>

</head>

<body>

<div class="header">

<h1>🎓 Student Promotion</h1>

<p>Promote Students to Next Academic Year</p>

</div>

<div class="container">

<div class="card">

<h2>Promotion Details</h2>

<form method="POST">

<label>Current Year</label>

<select name="current_year" id="current_year" required>

<option value="">Select Current Year</option>

<option value="1">1st Year</option>

<option value="2">2nd Year</option>

<option value="3">3rd Year</option>

<option value="4">4th Year</option>

</select>

<label>Promote To</label>

<select name="new_year" id="new_year" required>

<option value="">Select New Year</option>

<option value="2">2nd Year</option>

<option value="3">3rd Year</option>

<option value="4">4th Year</option>

</select>

<div class="info">

<b>Note:</b>

<ul>

<li>1st Year → 2nd Year</li>

<li>2nd Year → 3rd Year</li>

<li>3rd Year → 4th Year</li>

<li>4th Year → Completed (Student Deleted & Room Vacated)</li>

</ul>

</div>

<button
class="promote"
type="submit"
onclick="return confirm('Are you sure you want to promote these students?')">

🎓 Promote Students

</button>

</form>

<br>

<a href="/admin/students">

<button
class="back"
type="button">

⬅ Back to Students

</button>

</a>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System

</div>

<script>

let current=document.getElementById("current_year");
let next=document.getElementById("new_year");

current.onchange=function(){

if(this.value=="1"){

next.innerHTML="<option value='2'>2nd Year</option>";

}

else if(this.value=="2"){

next.innerHTML="<option value='3'>3rd Year</option>";

}

else if(this.value=="3"){

next.innerHTML="<option value='4'>4th Year</option>";

}

else if(this.value=="4"){

next.innerHTML="<option value='completed'>Completed (Delete Students)</option>";

}

else{

next.innerHTML="<option value=''>Select New Year</option>";

}

};

</script>

</body>

</html>
