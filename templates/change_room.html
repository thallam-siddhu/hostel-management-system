<!DOCTYPE html>
<html>

<head>

<title>Change Room</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

.header{
background:#2c3e50;
color:white;
padding:20px;
text-align:center;
}

.container{
width:500px;
margin:40px auto;
}

.card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

label{
font-weight:bold;
}

select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.save{
background:green;
}

.back{
background:#3498db;
}

</style>

</head>

<body>

<div class="header">

<h1>🔄 Change Student Room</h1>

</div>

<div class="container">

<div class="card">

<h3>Student : {{ student[0] }}</h3>

<form method="POST">

<label>Select New Room</label>

<select name="room_id" required>

{% for room in rooms %}

<option value="{{ room[0] }}">

Room {{ room[1] }}

</option>

{% endfor %}

</select>

<button class="save">

Save Changes

</button>

</form>

<br>

<a href="/admin/students">

<button class="back">

⬅ Back

</button>

</a>

</div>

</div>

</body>

</html>
