<!DOCTYPE html>
<html>
<head>
    <title>Edit Mess Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        button {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Edit Mess Menu</h2>

    <form method="POST">

        <label>Day</label>
        <input 
            type="text" 
            name="day" 
            value="{{ menu[1] }}" 
            required
        >


        <label>Breakfast</label>
        <textarea name="breakfast" required>{{ menu[2] }}</textarea>


        <label>Lunch</label>
        <textarea name="lunch" required>{{ menu[3] }}</textarea>


        <label>Dinner</label>
        <textarea name="dinner" required>{{ menu[4] }}</textarea>


        <button type="submit">
            Update Menu
        </button>

    </form>


    <a class="back" href="{{ url_for('admin_mess_management') }}">
        ← Back to Mess Management
    </a>

</div>

</body>
</html>
