<!DOCTYPE html>
<html>

<head>

<title>Room Management</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.card{

    background:white;

    border-radius:12px;

    padding:35px;

    box-shadow:0 5px 15px rgba(0,0,0,.2);

}

.card h2{

    text-align:center;

    color:#2c3e50;

    margin-bottom:30px;

}

.menu{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

}

.box{

    text-decoration:none;

    background:white;

    border-radius:10px;

    padding:30px;

    text-align:center;

    box-shadow:0 4px 12px rgba(0,0,0,.15);

    transition:.3s;

    color:#2c3e50;

}

.box:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 20px rgba(0,0,0,.25);

}

.icon{

    font-size:50px;

    margin-bottom:15px;

}

.title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:8px;

}

.desc{

    color:#666;

    font-size:14px;

}

.back{

    text-align:center;

    margin-top:35px;

}

.back a{

    text-decoration:none;

}

.back button{

    background:#2c3e50;

    color:white;

    border:none;

    padding:12px 30px;

    border-radius:6px;

    cursor:pointer;

    font-size:15px;

}

.back button:hover{

    background:#1f2d3d;

}

.footer{

    text-align:center;

    margin-top:40px;

    color:#777;

    font-size:14px;

}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="card">

<h2>🏢 Room Management</h2>

<div class="menu">

<a href="/admin/blocks" class="box">

<div class="icon">

🏢

</div>

<div class="title">

Block Management

</div>

<div class="desc">

Add, Edit and Delete Hostel Blocks

</div>

</a>

<a href="/admin/floors" class="box">

<div class="icon">

🏬

</div>

<div class="title">

Floor Management

</div>

<div class="desc">

Manage Floors for Every Hostel Block

</div>

</a>

<a href="/admin/rooms" class="box">

<div class="icon">

🚪

</div>

<div class="title">

Room Management

</div>

<div class="desc">

Add, Edit and Manage Hostel Rooms

</div>

</a>

</div>

<div class="back">

<a href="/admin/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | Room Management

</div>

</body>

</html>
