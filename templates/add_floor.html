<!DOCTYPE html>
<html>

<head>

<title>Add Floor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:25px;
    font-size:28px;
    font-weight:bold;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:60px;
}

.card{
    width:450px;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.card h2{
    text-align:center;
    color:#2c3e50;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

select,
input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

select:focus,
input:focus{
    outline:none;
    border-color:#3498db;
}

.add-btn{
    width:100%;
    padding:12px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.add-btn:hover{
    background:#229954;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
}

.back button{
    background:#2c3e50;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

.back button:hover{
    background:#1f2d3d;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:#777;
    font-size:14px;
}

</style>

</head>

<body>

<div class="header">

🏫 Hostel Management System

</div>

<div class="container">

<div class="card">

<h2>🏬 Add New Floor</h2>

<form method="POST">

<label>Select Block</label>

<select name="block_id" required>

{% for block in blocks %}

<option value="{{ block[0] }}">

{{ block[1] }}

</option>

{% endfor %}

</select>

<label>Floor Name</label>

<input
type="text"
name="floor_name"
placeholder="Example: Ground Floor / First Floor"
required>

<button
type="submit"
class="add-btn">

➕ Add Floor

</button>

</form>

<div class="back">

<a href="/admin/floors">

<button type="button">

⬅ Back to Floor Management

</button>

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 Hostel Management System | Floor Management

</div>

</body>

</html>
