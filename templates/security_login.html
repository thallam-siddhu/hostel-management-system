<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Login | Hostel Management System</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0f172a; /* Dark slate base */
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 1;
            animation: float 12s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            top: -150px;
            left: -150px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: linear-gradient(135deg, #b45309, #78350f);
            bottom: -150px;
            right: -150px;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 30px) scale(1.05); }
        }

        /* Top Header */
        .header {
            position: relative;
            z-index: 10;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        /* Main Container & Glass Card */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-grow: 1;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-header h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-header h2 i {
            color: #fbbf24;
        }

        .card-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Form Controls */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #64748b;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #f59e0b;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        input:focus + i,
        .input-wrapper:focus-within i {
            color: #f59e0b;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(245, 158, 11, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(245, 158, 11, 0.5);
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        /* Info Box */
        .info-box {
            margin-top: 24px;
            padding: 14px 16px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            color: #fbbf24;
            font-size: 13px;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .info-box i {
            margin-top: 2px;
            font-size: 15px;
        }

        /* Back Action */
        .back-wrapper {
            margin-top: 24px;
            text-align: center;
        }

        a {
            text-decoration: none;
        }

        .back-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Ambient Glow Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Header -->
    <div class="header">
        <div class="header-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        Hostel Management System
    </div>

    <!-- Main Card -->
    <div class="container">
        <div class="card">
            
            <div class="card-header">
                <h2><i class="fa-solid fa-user-shield"></i> Security Portal</h2>
                <p>Gatekeeper & Verification Access</p>
            </div>

            <form method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Enter Security Username" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter Password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i> Security Login
                </button>
            </form>

            <div class="info-box">
                <i class="fa-solid fa-circle-info"></i>
                <span>Security staff can verify student pass permissions and log entry/exit records in real time.</span>
            </div>

            <div class="back-wrapper">
                <a href="/">
                    <button type="button" class="back-btn">
                        <i class="fa-solid fa-arrow-left"></i> Back to Home
                    </button>
                </a>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 Hostel Management System • Security Verification Portal
    </div>

</body>

</html>
